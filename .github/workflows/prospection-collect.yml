# Collecte planifiée des prospects (Google Places → service de prospection).
#
# Tourne le 1er de chaque mois à 6 h UTC (7 h à Alger), ou à la main depuis
# l'onglet Actions. Mensuel, pas hebdomadaire : un passage complet fait au plus
# ~620 appels Places et le quota gratuit du palier facturé ici (Text Search
# Enterprise : numéro de téléphone, site, note) est de 1 000 appels par mois.
# Quatre passages par mois seraient facturés ; un seul reste gratuit.
# Sans la clé Google dans les secrets du dépôt, le job s'arrête poliment au
# lieu d'échouer en rouge chaque mois.
#
# Secrets à définir dans Settings → Secrets and variables → Actions :
#   PLACES_API_KEY        clé Google Cloud avec l'API Places (New) activée
#   PROSPECTION_API_URL   URL publique du service Go (ex. https://prospection.up.railway.app)
#   COLLECTOR_TOKEN       le même COLLECTOR_TOKEN que celui du service

name: Prospection — collecte

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      wilayas:
        description: "Wilayas à collecter, séparées par des espaces (vide = les 69)"
        required: false
        default: ""

jobs:
  collect:
    name: Collecter et envoyer
    runs-on: ubuntu-latest

    # Pas de working-directory par défaut : la première étape tourne avant le
    # checkout, quand le dossier du collecteur n'existe pas encore. Les étapes
    # qui en ont besoin le précisent elles-mêmes.
    steps:
      - name: Vérifier la configuration
        id: config
        env:
          HAS_KEY: ${{ secrets.PLACES_API_KEY != '' && secrets.PROSPECTION_API_URL != '' && secrets.COLLECTOR_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::PLACES_API_KEY / PROSPECTION_API_URL / COLLECTOR_TOKEN absents : collecte ignorée."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer
        if: steps.config.outputs.configured == 'true'
        working-directory: prospection/collector
        run: pip install .

      - name: Collecter
        if: steps.config.outputs.configured == 'true'
        working-directory: prospection/collector
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PROSPECTION_API_URL: ${{ secrets.PROSPECTION_API_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          WILAYAS: ${{ github.event.inputs.wilayas }}
        run: |
          if [ -n "$WILAYAS" ]; then
            # shellcheck disable=SC2086
            plugin-collect run --wilayas $WILAYAS
          else
            plugin-collect run
          fi
