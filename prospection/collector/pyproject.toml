[project]
name = "plugin-dz-collector"
version = "0.1.0"
description = "Collecte les boutiques d'accessoires téléphone en Algérie (Google Places) et les envoie au service de prospection."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
plugin-collect = "collector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
